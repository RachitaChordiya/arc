    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Montserrat:wght@400;500;600;700&family=PT+Sans+Narrow:wght@400;700&display=swap"

    />

    <link rel="stylesheet" crossorigin href="/arc/assets/index-D8PlR4_Y.css">
    <link rel="stylesheet" href="/arc/assets/project-stack.css">
  </head>
  <body>
    <div id="root"></div>
    <div class="arc-cursor" hidden>
      <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <circle cx="16" cy="16" r="14" pathLength="100"></circle>
      </svg>
    </div>
    <script>
      (function () {
        var fine = window.matchMedia("(hover: hover) and (pointer: fine)");
        if (!fine.matches) return;
        var el = document.querySelector(".arc-cursor");
        if (!el) return;
        document.documentElement.classList.add("has-custom-cursor");
        el.hidden = false;
        var tabSel = "nav a, nav button, .site-nav__link, .site-nav__dot, .site-header__links a, .site-header__links button, .site-header__meta-link, .site-header__about, [role='tab'], [role='tablist'] a, [role='tablist'] button";
        function isTab(node) {
          while (node && node !== document.body) {
            if (node.nodeType === 1 && node.matches(tabSel)) return true;
            node = node.parentElement;
          }
          return false;
        }
        window.addEventListener("pointermove", function (e) {
          el.style.transform = "translate(" + e.clientX + "px, " + e.clientY + "px)";
          el.classList.toggle("is-tab", isTab(e.target));
        }, { passive: true });
        fine.addEventListener("change", function (e) {
          if (!e.matches) {
            document.documentElement.classList.remove("has-custom-cursor");
            el.hidden = true;
          }
        });
      })();
    </script>
  </body>
</html>
